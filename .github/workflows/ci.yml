name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Smoke quickstart
        run: |
          retrievalgate validate examples/minimal/scenarios/
          retrievalgate run examples/minimal/scenarios/ \
            --adapter "python examples/minimal/retriever.py" \
            --output result.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke clean wheel install
        run: |
          python -m venv /tmp/retrievalgate-release-smoke
          /tmp/retrievalgate-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/retrievalgate-release-smoke/bin/retrievalgate --help
          /tmp/retrievalgate-release-smoke/bin/retrievalgate \
            validate examples/minimal/scenarios/
          /tmp/retrievalgate-release-smoke/bin/retrievalgate \
            run examples/minimal/scenarios/ \
            --adapter "/tmp/retrievalgate-release-smoke/bin/python examples/minimal/retriever.py"
