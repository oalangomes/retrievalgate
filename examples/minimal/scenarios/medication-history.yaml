schema_version: 1
id: medication-history
query: add medication usage history endpoint
top_k: 3

evaluation:
  cutoffs: [1, 3]

ground_truth:
  relevant:
    - src/services/medicationUsageHistoryService.js
    - src/controllers/medicationUsageController.js
    - tests/medicationUsageHistoryService.test.js
  exhaustive: false

gates:
  Success@1:
    min: 1.0
  Recall@3:
    min: 1.0
  nDCG@3:
    min: 0.9

regression_gates:
  Recall@3:
    max_drop: 0.05
